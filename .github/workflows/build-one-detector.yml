name: Build One — detector regression tests

on:
  push:
    branches: [main, build/one-detector]
  pull_request:

jobs:
  detector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only detector dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile detector.py test_detector.py
      - name: Run preserved upstream detector regressions
        run: python -m unittest -v test_detector
      - name: Run project standards tests
        run: python -m unittest discover -s tests -v
