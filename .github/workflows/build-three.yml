name: Build Three — sacrifice and campaign contract

on:
  push:
    branches: [build/three-configurable-sacrifice-20261123, concentration/build-one]
  pull_request:

jobs:
  python312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements_live.txt
      - name: Targeted contract regressions
        run: python -m unittest -q test_campaign_v3 test_sacrifice_failure_repro test_configured_exits test_configured_launcher test_configured_monitor test_configured_pipeline test_configured_manual
      - name: Historical suites (unchanged)
        run: |
          python -m unittest -q test_lamb_500_block_gate
          python -m unittest discover -p 'test_*.py' -q
