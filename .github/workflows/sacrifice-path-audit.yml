name: Sacrifice path audit — original 500 block tests

on:
  push:
    branches: [audit/sacrifice-live-path-20261123]

jobs:
  audit-sacrifice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_live.txt
      - name: Historical 500 block and manifest behavioural checks
        run: |
          python -m unittest -q test_lamb_500_block_gate test_lamb_500_block_monitor \
            test_probe_policy_manifest.TestCampaignPolicy.test_new_flex_manifest_frozen_at_seven \
            test_probe_policy_manifest.TestCampaignPolicy.test_missing_wrong_and_legacy_rules_cannot_start \
            test_probe_policy_manifest.TestCampaignPolicy.test_launcher_500_block_helper_rejects_unversioned_policy \
            test_probe_policy_manifest.TestCampaignPolicy.test_existing_ledger_requires_exact_policy_without_writing
      - name: Requirement verification — expected to expose live readiness failures
        run: python -m unittest -q test_sacrifice_failure_repro
